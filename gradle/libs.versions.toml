# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
guava          = "33.4.6-jre"
junit-jupiter  = "5.12.1"
junit-platform = "1.12.1"
picocli        = "4.7.6"
jackson        = "2.18.3"
commons-csv    = "1.12.0"
assertj        = "3.27.3"
mockito        = "5.16.1"
cucumber       = "7.21.1"

[libraries]
guava                    = { module = "com.google.guava:guava",                                  version.ref = "guava" }
junit-jupiter            = { module = "org.junit.jupiter:junit-jupiter",                         version.ref = "junit-jupiter" }
junit-platform-launcher  = { module = "org.junit.platform:junit-platform-launcher",              version.ref = "junit-platform" }
junit-platform-suite     = { module = "org.junit.platform:junit-platform-suite",                 version.ref = "junit-platform" }
picocli                  = { module = "info.picocli:picocli",                                     version.ref = "picocli" }
jackson-databind         = { module = "com.fasterxml.jackson.core:jackson-databind",             version.ref = "jackson" }
jackson-datatype-jsr310  = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
commons-csv              = { module = "org.apache.commons:commons-csv",                          version.ref = "commons-csv" }
assertj                  = { module = "org.assertj:assertj-core",                                version.ref = "assertj" }
mockito-core             = { module = "org.mockito:mockito-core",                                version.ref = "mockito" }
mockito-junit-jupiter    = { module = "org.mockito:mockito-junit-jupiter",                       version.ref = "mockito" }
cucumber-java            = { module = "io.cucumber:cucumber-java",                               version.ref = "cucumber" }
cucumber-junit-platform  = { module = "io.cucumber:cucumber-junit-platform-engine",              version.ref = "cucumber" }
