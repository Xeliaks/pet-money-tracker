plugins {
    id 'application'
    id 'jacoco'
    id 'checkstyle'
    id 'pmd'
    id 'com.github.spotbugs' version '6.1.7'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'pet.money.tracker.cli.MainCommand'
}

dependencies {
    implementation libs.guava
    implementation libs.picocli
    implementation libs.jackson.databind
    implementation libs.jackson.datatype.jsr310
    implementation libs.commons.csv

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj
    testImplementation libs.mockito.core
    testImplementation libs.mockito.junit.jupiter
    testImplementation libs.cucumber.java
    testImplementation libs.cucumber.junit.platform
    testImplementation libs.junit.platform.suite

    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// ── JaCoCo ────────────────────────────────────────────────────────────────────

jacoco {
    toolVersion = '0.8.12'
}

def jacocoExcludes = [
    'pet/money/tracker/cli/**',
    'pet/money/tracker/exception/**',
    'pet/money/tracker/App.class'
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required  = true
        html.required = true
        csv.required  = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value   = 'COVEREDRATIO'
                minimum = 0.70
            }
            limit {
                counter = 'BRANCH'
                value   = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

// ── Checkstyle ────────────────────────────────────────────────────────────────

checkstyle {
    toolVersion    = '10.21.4'
    configFile     = file("${rootDir}/config/checkstyle/checkstyle.xml")
    ignoreFailures = false
    showViolations = true
}

// ── SpotBugs ──────────────────────────────────────────────────────────────────

spotbugs {
    toolVersion    = '4.9.3'
    excludeFilter  = file("${rootDir}/config/spotbugs/exclude.xml")
    ignoreFailures = false
    effort         = 'max'
    reportLevel    = 'medium'
}

spotbugsMain {
    reports {
        html { required = true }
        xml  { required = false }
    }
}

// ── PMD ───────────────────────────────────────────────────────────────────────

pmd {
    toolVersion    = '7.9.0'
    consoleOutput  = true
    ruleSetFiles   = files("${rootDir}/config/pmd/ruleset.xml")
    ruleSets       = []
    ignoreFailures = false
}

pmdTest {
    ruleSetFiles = files("${rootDir}/config/pmd/ruleset-test.xml")
    ruleSets     = []
}